<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Candy Crush</title>
  <meta name="description" content="A sweet match-3 game. Built on Omarchy.">
  <meta name="theme-color" content="#2b1055">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="bubbles" aria-hidden="true"></div>

  <header>
    <div class="brand">🍒 Candy Crush</div>
    <div class="header-actions">
      <button class="chip" id="player-chip" title="Your profile">👤 <span id="player-name-label">Sign in</span></button>
      <button class="chip" id="settings-btn" aria-label="Settings">⚙️</button>
    </div>
  </header>

  <div class="stats-row">
    <div class="stat">Score<b id="score">0</b></div>
    <div class="stat">Best<b id="best">0</b></div>
    <div class="stat">Moves<b id="moves">30</b></div>
  </div>

  <main>
    <div class="board-wrap">
      <div id="board" aria-label="Candy board"></div>
      <div id="fx-layer" aria-hidden="true"></div>
    </div>
  </main>

  <div id="overlay" class="hidden">
    <div class="panel">
      <h2 id="overlay-title">Out of moves!</h2>
      <p id="overlay-text"></p>
      <button id="restart">Play again</button>
    </div>
  </div>

  <div id="settings" class="modal hidden">
    <div class="panel settings-panel">
      <button class="close" id="settings-close" aria-label="Close">✕</button>
      <h2>Settings</h2>

      <section>
        <h3>👤 Player</h3>
        <label class="field">Name
          <input id="player-name" type="text" placeholder="Your name" autocomplete="name" maxlength="24">
        </label>
        <label class="field">Email
          <input id="player-email" type="email" placeholder="you@example.com" autocomplete="email">
        </label>
        <p class="hint" id="email-hint">Saved on this device only.</p>
        <button class="small" id="save-profile">Save profile</button>
      </section>

      <section>
        <h3>✨ Experience</h3>
        <label class="toggle-row">
          <span>🔊 Sound effects</span>
          <input type="checkbox" id="toggle-sound" checked>
          <span class="switch"></span>
        </label>
        <label class="toggle-row">
          <span>📳 Vibration</span>
          <input type="checkbox" id="toggle-vibration" checked>
          <span class="switch"></span>
        </label>
        <p class="hint">Vibration works on Android — iOS doesn't allow it for websites.</p>
        <label class="toggle-row">
          <span>🫧 Floating bubbles</span>
          <input type="checkbox" id="toggle-bubbles" checked>
          <span class="switch"></span>
        </label>
      </section>

      <section id="install-section">
        <h3>📲 Install</h3>
        <button id="install-btn" class="hidden">Install app</button>
        <p class="hint" id="install-hint"></p>
      </section>
    </div>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
